# Arcana Cloud Rust - Layered Deployment with Docker Compose
#
# Architecture:
#   Client -> Controller (REST) -> Service (gRPC) -> Repository (gRPC) -> Database
#
# Usage:
#   docker-compose up -d
#   docker-compose logs -f
#   docker-compose down
#
# Each layer communicates with the next layer via gRPC:
#   - Controller exposes REST API (port 8080) and calls Service layer via gRPC
#   - Service exposes gRPC (port 9090) and calls Repository layer via gRPC
#   - Repository exposes gRPC (port 9090) and connects to MySQL database
#
# Two further roles run beside that chain rather than inside it:
#   - worker    drains the job queues (scales out; add replicas freely)
#   - scheduler fires cron entries (leader-elected; exactly one active)
# Both are the same binary selected by ARCANA_DEPLOYMENT__LAYER, matching the
# Kubernetes deployment one-to-one.

services:
  # MySQL Database
  mysql:
    image: mysql:26.7
    container_name: arcana-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-arcana_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-arcana}
      MYSQL_USER: ${MYSQL_USER:-arcana}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-arcana}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - arcana-network

  # Redis - job queue backing store, shared by worker and scheduler
  redis:
    image: redis:8-alpine
    container_name: arcana-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arcana-network

  # Repository Layer - Database access via gRPC
  repository:
    build:
      context: ../..
      dockerfile: deployment/layered/Dockerfile
      args:
        LAYER: repository
    container_name: arcana-repository
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      RUST_LOG: info,arcana=debug
      ARCANA_APP__ENVIRONMENT: production
      # No certificate pair is mounted in this stack; see config/production.toml.
      ARCANA_SECURITY__GRPC_TLS_ENABLED: "false"
      ARCANA_DEPLOYMENT__MODE: layeredgrpc
      ARCANA_DEPLOYMENT__LAYER: repository
      ARCANA_SERVER__GRPC_HOST: 0.0.0.0
      ARCANA_SERVER__GRPC_PORT: 9090
      ARCANA_DATABASE__URL: mysql://${MYSQL_USER:-arcana}:${MYSQL_PASSWORD:-arcana}@mysql:3306/${MYSQL_DATABASE:-arcana}
    ports:
      - "9091:9090"
    networks:
      - arcana-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/grpc.health.v1.Health/Check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Service Layer - Business logic via gRPC
  service:
    build:
      context: ../..
      dockerfile: deployment/layered/Dockerfile
      args:
        LAYER: service
    container_name: arcana-service
    depends_on:
      repository:
        condition: service_started
    environment:
      RUST_LOG: info,arcana=debug
      ARCANA_APP__ENVIRONMENT: production
      # No certificate pair is mounted in this stack; see config/production.toml.
      ARCANA_SECURITY__GRPC_TLS_ENABLED: "false"
      ARCANA_DEPLOYMENT__MODE: layeredgrpc
      ARCANA_DEPLOYMENT__LAYER: service
      ARCANA_SERVER__GRPC_HOST: 0.0.0.0
      ARCANA_SERVER__GRPC_PORT: 9090
      ARCANA_DEPLOYMENT__REPOSITORY_URL: http://repository:9090
      # Security configuration
      ARCANA_SECURITY__JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ARCANA_SECURITY__JWT_ISSUER: arcana-cloud
      ARCANA_SECURITY__JWT_AUDIENCE: arcana-api
      ARCANA_SECURITY__PASSWORD_HASH_COST: 12
    ports:
      - "9092:9090"
    networks:
      - arcana-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/grpc.health.v1.Health/Check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Controller Layer - REST API
  controller:
    build:
      context: ../..
      dockerfile: deployment/layered/Dockerfile
      args:
        LAYER: controller
    container_name: arcana-controller
    depends_on:
      service:
        condition: service_started
    environment:
      RUST_LOG: info,arcana=debug
      ARCANA_APP__ENVIRONMENT: production
      # No certificate pair is mounted in this stack; see config/production.toml.
      ARCANA_SECURITY__GRPC_TLS_ENABLED: "false"
      ARCANA_DEPLOYMENT__MODE: layeredgrpc
      ARCANA_DEPLOYMENT__LAYER: controller
      ARCANA_SERVER__REST_HOST: 0.0.0.0
      ARCANA_SERVER__REST_PORT: 8080
      ARCANA_DEPLOYMENT__SERVICE_URL: http://service:9090
      # Security configuration for JWT validation
      ARCANA_SECURITY__JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ARCANA_SECURITY__JWT_ISSUER: arcana-cloud
      ARCANA_SECURITY__JWT_AUDIENCE: arcana-api
    ports:
      - "8080:8080"
    networks:
      - arcana-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Worker - drains the job queues.
  #
  # Stateless: no database, no inbound API. Scale with
  # `docker compose up -d --scale worker=N` (drop the container_name first).
  worker:
    build:
      context: ../..
      dockerfile: deployment/layered/Dockerfile
      args:
        LAYER: worker
    container_name: arcana-worker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      RUST_LOG: info,arcana=debug
      ARCANA_APP__ENVIRONMENT: production
      # No certificate pair is mounted in this stack; see config/production.toml.
      ARCANA_SECURITY__GRPC_TLS_ENABLED: "false"
      ARCANA_DEPLOYMENT__MODE: layeredgrpc
      ARCANA_DEPLOYMENT__LAYER: worker
      ARCANA_SERVER__REST_HOST: 0.0.0.0
      ARCANA_SERVER__REST_PORT: 8080
      ARCANA_JOBS__ENABLED: "true"
      ARCANA_JOBS__REDIS__URL: redis://redis:6379
      ARCANA_JOBS__WORKER__CONCURRENCY: 4
      ARCANA_JOBS__WORKER__QUEUES: critical,high,default,low
    networks:
      - arcana-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Scheduler - fires cron entries.
  #
  # Leadership is a Redis key, so extra replicas are warm standby only; never
  # scale this for throughput.
  scheduler:
    build:
      context: ../..
      dockerfile: deployment/layered/Dockerfile
      args:
        LAYER: scheduler
    container_name: arcana-scheduler
    depends_on:
      redis:
        condition: service_healthy
    environment:
      RUST_LOG: info,arcana=debug
      ARCANA_APP__ENVIRONMENT: production
      # No certificate pair is mounted in this stack; see config/production.toml.
      ARCANA_SECURITY__GRPC_TLS_ENABLED: "false"
      ARCANA_DEPLOYMENT__MODE: layeredgrpc
      ARCANA_DEPLOYMENT__LAYER: scheduler
      ARCANA_SERVER__REST_HOST: 0.0.0.0
      ARCANA_SERVER__REST_PORT: 8080
      ARCANA_JOBS__ENABLED: "true"
      ARCANA_JOBS__REDIS__URL: redis://redis:6379
      ARCANA_JOBS__SCHEDULER__LEADER_TTL_SECS: 30
      ARCANA_JOBS__SCHEDULER__CHECK_INTERVAL_SECS: 60
    networks:
      - arcana-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  arcana-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
