apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: arcana-jobs

namespace: arcana

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: arcana-jobs
      app.kubernetes.io/part-of: arcana
      app.kubernetes.io/managed-by: kustomize

resources:
  - redis-deployment.yaml
  - worker-deployment.yaml
  - scheduler-deployment.yaml
  - config.yaml

configMapGenerator:
  - name: arcana-jobs-env
    literals:
      - RUST_LOG=info,arcana=debug
      # Selects config/production.toml inside the image. The role itself is set
      # per-Deployment via ARCANA_DEPLOYMENT__LAYER, never here.
      - ARCANA_ENVIRONMENT=production
      - ARCANA_APP__ENVIRONMENT=production

images:
  - name: arcana-server
    newTag: latest

# Common labels for all resources
commonLabels:
  app: arcana
  environment: development

# Patches for development/production
patches: []

# Replicas can be overridden in overlays
replicas:
  - name: arcana-job-worker
    count: 2
  - name: arcana-job-scheduler
    count: 2
