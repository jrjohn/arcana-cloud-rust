# Background job worker.
#
# Role selection is the ARCANA_DEPLOYMENT__LAYER env var -- the binary parses
# no command-line flags, so `args` here would be silently ignored.
#
# Sizing: stateless, holds only a Redis pool. Scales on queue depth, not on
# request rate. Concurrency x job cost drives memory, so raise the limit
# alongside ARCANA_JOBS__WORKER__CONCURRENCY, not independently of it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcana-job-worker
  labels:
    app: arcana
    component: job-worker
    tier: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: arcana
      component: job-worker
  template:
    metadata:
      labels:
        app: arcana
        component: job-worker
        tier: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: arcana-worker
      # Must exceed jobs.worker.shutdown_timeout_secs (30) so in-flight jobs
      # finish instead of being killed mid-execution.
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: arcana-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            # One port serves /health, /live, /ready and /metrics.
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: arcana-jobs-env
          env:
            - name: ARCANA_DEPLOYMENT__LAYER
              value: "worker"
            - name: ARCANA_JOBS__ENABLED
              value: "true"
            - name: ARCANA_JOBS__REDIS__URL
              valueFrom:
                secretKeyRef:
                  name: arcana-jobs-secrets
                  key: redis-url
            - name: ARCANA_JOBS__WORKER__CONCURRENCY
              value: "4"
            - name: ARCANA_JOBS__WORKER__QUEUES
              value: "critical,high,default,low"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: component
                      operator: In
                      values:
                        - job-worker
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: arcana-job-worker
  labels:
    app: arcana
    component: job-worker
spec:
  type: ClusterIP
  ports:
    # Named "metrics" because the ServiceMonitor selects the port by name.
    - port: 8080
      targetPort: http
      protocol: TCP
      name: metrics
  selector:
    app: arcana
    component: job-worker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arcana-worker
  labels:
    app: arcana
    component: job-worker
---
# The worker is the only job role that may autoscale: it is stateless and its
# backlog is directly observable. `arcana_jobs_pending` requires the Prometheus
# adapter to be installed; without it this metric is ignored and only the CPU
# target applies.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: arcana-job-worker-hpa
  labels:
    app: arcana
    component: job-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: arcana-job-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          name: arcana_jobs_pending
        target:
          type: AverageValue
          averageValue: "100"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
