# Cron scheduler.
#
# Role selection is the ARCANA_DEPLOYMENT__LAYER env var -- the binary parses
# no command-line flags, so `args` here would be silently ignored.
#
# Sizing: exactly one replica does work at a time; leadership is held in Redis
# (jobs.scheduler.leader_ttl_secs), not through the Kubernetes lease API. The
# second replica is a warm standby, so this must NEVER have an HPA -- extra
# replicas add standby cost and no throughput.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcana-job-scheduler
  labels:
    app: arcana
    component: job-scheduler
    tier: scheduler
spec:
  # One leader + one standby.
  replicas: 2
  selector:
    matchLabels:
      app: arcana
      component: job-scheduler
  template:
    metadata:
      labels:
        app: arcana
        component: job-scheduler
        tier: scheduler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: arcana-scheduler
      terminationGracePeriodSeconds: 30
      containers:
        - name: scheduler
          image: arcana-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            # One port serves /health, /live, /ready and /metrics.
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: arcana-jobs-env
          env:
            - name: ARCANA_DEPLOYMENT__LAYER
              value: "scheduler"
            - name: ARCANA_JOBS__ENABLED
              value: "true"
            - name: ARCANA_JOBS__REDIS__URL
              valueFrom:
                secretKeyRef:
                  name: arcana-jobs-secrets
                  key: redis-url
            - name: ARCANA_JOBS__SCHEDULER__LEADER_TTL_SECS
              value: "30"
            - name: ARCANA_JOBS__SCHEDULER__CHECK_INTERVAL_SECS
              value: "60"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: component
                    operator: In
                    values:
                      - job-scheduler
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: arcana-job-scheduler
  labels:
    app: arcana
    component: job-scheduler
spec:
  type: ClusterIP
  ports:
    # Named "metrics" because the ServiceMonitor selects the port by name.
    - port: 8080
      targetPort: http
      protocol: TCP
      name: metrics
  selector:
    app: arcana
    component: job-scheduler
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arcana-scheduler
  labels:
    app: arcana
    component: job-scheduler
# No Role/RoleBinding: leadership is held on a Redis key, so the scheduler
# needs no Kubernetes API access. Granting lease permissions it never uses
# would only widen the blast radius of a compromised pod.
