# Arcana Cloud Rust - top-level entry point
# Deploy with: kubectl apply -k deployment/kubernetes/
#
# The manifests live in base/ and the per-environment overlays in overlays/.
# They are siblings on purpose: kustomize refuses to build an overlay that
# sits inside the directory it references ("cycle detected"), which is what
# made every overlay here unbuildable while this file was the base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: arcana-cloud-rust

resources:
  - base
