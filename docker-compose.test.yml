services:
  test:
    build:
      context: .
      dockerfile: Dockerfile.ci
      target: builder
    working_dir: /app
    # Blocking gate: no trailing `|| true`, so a non-zero cargo exit propagates out of
    # `docker compose run`. Scope to --lib --bins: the only `tests/` integration target,
    # arcana-repository/tests/user_repository_test.rs, spins up a MySQL testcontainer and
    # needs /var/run/docker.sock, which this lane has no access to (SocketNotFoundError).
    # That matches the coverage lane's existing `--lib` choice ("skip database integration
    # tests that require a live DB"); those DB tests belong in a DB-provisioned lane.
    # --no-fail-fast still runs every unit test before returning non-zero.
    # After the tests, run clippy over the same scope (--lib --bins) and write the JSON
    # report SonarQube imports. Same container, so the debug artifacts cargo test just
    # built are reused and clippy only re-checks the workspace crates (~1-2 min) instead
    # of recompiling ~400 dependencies.
    # Clippy is a gate: the lint levels live in Cargo.toml [workspace.lints] (clippy::all
    # enforced, pedantic not yet), and a second, cached pass with -D warnings fails the
    # build on any warning. The report is still written first so SonarQube gets it even
    # when the gate fails. Test failures take precedence in the exit code.
    command:
      - sh
      - -c
      - |
        cargo test --workspace --lib --bins --no-fail-fast 2>&1
        RC=$$?
        cargo clippy --workspace --lib --bins --message-format=json \
          > /app/clippy-report.json 2> /app/clippy-stderr.txt || true
        echo "clippy report: $$(wc -l < /app/clippy-report.json) json lines"
        cargo clippy --workspace --lib --bins -- -D warnings > /app/clippy-gate.txt 2>&1
        CLIPPY_RC=$$?
        tail -40 /app/clippy-gate.txt
        if [ "$$CLIPPY_RC" -ne 0 ]; then echo "CLIPPY GATE FAILED: fix the warnings above (lint levels in Cargo.toml [workspace.lints])"; fi
        [ "$$RC" -ne 0 ] && exit $$RC
        exit $$CLIPPY_RC

  coverage:
    # ARM64-native: cargo-llvm-cov (tarpaulin is x86_64 only)
    build:
      context: .
      dockerfile: Dockerfile.coverage
    working_dir: /app
    volumes:
      - ./coverage:/output
    # Use --lib to skip database integration tests that require a live DB
    command:
      - sh
      - -c
      - |
        cargo llvm-cov --lib --workspace --no-fail-fast \
          --lcov --output-path /output/lcov.info \
          --ignore-filename-regex 'generated|proto|target' \
          2>&1 || true
